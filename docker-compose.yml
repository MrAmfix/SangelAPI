version: "3.0"
services:
  backend-api:
    build: .
    ports:
      - "8001:8000"
    secrets:
      - backend-secrets
    networks:
      - swarm-network
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./sangel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sangel.cert:/etc/nginx/sangel.cert:ro
      - ./sangel.key:/etc/nginx/sangel.key:ro
    depends_on:
      - backend-api
    networks:
      - swarm-network
secrets:
  backend-secrets:
    file: ./.env
networks:
  swarm-netw ork:
    driver: overlay
    attachable: true
