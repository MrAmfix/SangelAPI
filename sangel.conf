upstream api {
    server backend:8000;
}

upstream runner {
        server 192.168.0.4:80;
}

server {
    listen 443 ssl;
    server_name api.sangel.ru;

        ssl_certificate /etc/nginx/sangel.cert;
        ssl_certificate_key /etc/nginx/sangel_key;


    location / {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}

server {
    listen 80;
    server_name api.sangel.ru;

        ssl_certificate /etc/nginx/sangel.cert;
        ssl_certificate_key /etc/nginx/sangel_key;


    location / {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}


server {
    listen 443 ssl;
    server_name sangel.ru www.sangel.ru;

        ssl_certificate /etc/nginx/sangel.cert;
        ssl_certificate_key /etc/nginx/sangel_key;


    location / {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}

server {
    listen 80;
    server_name sangel.ru www.sangel.ru;

        ssl_certificate /etc/nginx/sangel.cert;
        ssl_certificate_key /etc/nginx/sangel_key;


    location / {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}

server {
    listen 443 ssl;
    listen 80;
    server_name runner.sangel.ru;

        ssl_certificate /etc/nginx/sangel.cert;
        ssl_certificate_key /etc/nginx/sangel_key;


    location / {
        proxy_pass http://runner/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}