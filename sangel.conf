upstream api {
    server backend_api:8000;
}

server {
    listen 80;
    server_name api.mysite.ru mysite.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.mysite.ru;

        ssl_certificate /etc/nginx/mysite.cert;
        ssl_certificate_key /etc/nginx/mysite.key;


    location / {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    server_name mysite.ru;

        ssl_certificate /etc/nginx/mysite.cert;
        ssl_certificate_key /etc/nginx/mysite.key;
    
    return 301 https://mysite.online$request_uri;
}
